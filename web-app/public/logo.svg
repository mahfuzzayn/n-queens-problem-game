<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="mainGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff59d" />
      <stop offset="25%" stop-color="#ffd54f" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Bevel Rim Gold -->
    <linearGradient id="rimGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Velvet Inner Cushion -->
    <linearGradient id="velvetCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="60%" stop-color="#6b21a8" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>

    <!-- Ruby Gem Gradient -->
    <radialGradient id="ruby" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="35%" stop-color="#ef4444" />
      <stop offset="75%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#450a0a" />
    </radialGradient>

    <!-- Sapphire Gem Gradient -->
    <radialGradient id="sapphire" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="40%" stop-color="#0ea5e9" />
      <stop offset="80%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </radialGradient>

    <!-- Emerald Gem Gradient -->
    <radialGradient id="emerald" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bbf7d0" />
      <stop offset="40%" stop-color="#22c55e" />
      <stop offset="80%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#052e16" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Royal Velvet Cushion Inside Crown -->
    <path
      d="M 45 130 C 45 75, 155 75, 155 130 Z"
      fill="url(#velvetCap)"
      stroke="#2e1065"
      stroke-width="5"
    />

    <!-- Velvet Folds / Highlights -->
    <path d="M 70 128 C 80 92, 90 92, 100 128" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <path d="M 100 128 C 110 92, 120 92, 130 128" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round" opacity="0.6" />

    <!-- Crown Main Body (5 Peaks) -->
    <path
      d="M 32 142 L 20 62 L 64 96 L 100 36 L 136 96 L 180 62 L 168 142 Z"
      fill="url(#mainGold)"
      stroke="#451a03"
      stroke-width="7"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Crown Inner Shading / Emboss -->
    <path
      d="M 36 138 L 26 70 L 64 99 L 100 44 L 136 99 L 174 70 L 164 138 Z"
      fill="none"
      stroke="#fef08a"
      stroke-width="2.5"
      opacity="0.75"
    />

    <!-- Crown Base Band / Rim -->
    <rect
      x="24"
      y="136"
      width="152"
      height="26"
      rx="8"
      fill="url(#rimGold)"
      stroke="#451a03"
      stroke-width="6"
    />

    <!-- Rim Top Highlight -->
    <line x1="28" y1="139" x2="172" y2="139" stroke="#fffbeb" stroke-width="2" stroke-linecap="round" opacity="0.8" />

    <!-- Jewels on Peaks -->
    <!-- Left peak pearl -->
    <circle cx="20" cy="60" r="10" fill="#ffffff" stroke="#78350f" stroke-width="3.5" />
    <circle cx="17" cy="57" r="3" fill="#ffffff" />
    <!-- Left-mid peak sapphire -->
    <circle cx="64" cy="94" r="8" fill="url(#sapphire)" stroke="#0c4a6e" stroke-width="3" />
    <!-- Center peak diamond/star star-gem -->
    <circle cx="100" cy="34" r="12" fill="#ffffff" stroke="#78350f" stroke-width="4" />
    <circle cx="96" cy="30" r="4" fill="#ffffff" />
    <!-- Right-mid peak emerald -->
    <circle cx="136" cy="94" r="8" fill="url(#emerald)" stroke="#064e3b" stroke-width="3" />
    <!-- Right peak pearl -->
    <circle cx="180" cy="60" r="10" fill="#ffffff" stroke="#78350f" stroke-width="3.5" />
    <circle cx="177" cy="57" r="3" fill="#ffffff" />

    <!-- Rim Gemstones -->
    <!-- Center Large Ruby -->
    <ellipse cx="100" cy="149" rx="14" ry="9" fill="url(#ruby)" stroke="#450a0a" stroke-width="3" />
    <ellipse cx="98" cy="147" rx="5" ry="3" fill="#fecaca" opacity="0.6" />

    <!-- Left Sapphire -->
    <ellipse cx="60" cy="149" rx="10" ry="7" fill="url(#sapphire)" stroke="#082f49" stroke-width="2.5" />
    <ellipse cx="58" cy="147" rx="3.5" ry="2" fill="#e0f2fe" opacity="0.6" />

    <!-- Right Sapphire -->
    <ellipse cx="140" cy="149" rx="10" ry="7" fill="url(#sapphire)" stroke="#082f49" stroke-width="2.5" />
    <ellipse cx="138" cy="147" rx="3.5" ry="2" fill="#e0f2fe" opacity="0.6" />
  </g>
</svg>
