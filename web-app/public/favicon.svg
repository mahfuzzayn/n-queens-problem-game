  <circle cx="50" cy="18" r="5.5" fill="#ffffff" stroke="#78350f" stroke-width="1.5" />
  <circle cx="90" cy="30" r="4.5" fill="#ffffff" stroke="#78350f" stroke-width="1.5" />
